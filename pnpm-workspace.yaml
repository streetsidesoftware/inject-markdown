---
packages:
  - .

minimumReleaseAge: 2880 # two days
minimumReleaseAgeExclude:
  - '@streetsidesoftware/*' # published by our own release pipeline
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - undici-types@6.21.0

allowBuilds:
  esbuild: true

# cspell:dictionaries npm
